# Dataset Registry for Self-Learning Crop Intelligence System
# All datasets listed here are vetted for research/academic legality, open licenses, and multi-part plant coverage.
# Downloads are only executed via download_datasets.py upon explicit user request.
# No datasets are automatically downloaded at application startup.

datasets:
  - id: "plantdoc"
    name: "PlantDoc: A Dataset for Visual Plant Disease Detection in Natural Field Conditions"
    official_page: "https://github.com/pratikkayal/PlantDoc-Dataset"
    download_url: "https://github.com/pratikkayal/PlantDoc-Dataset/archive/refs/heads/master.zip"
    license: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
    citation: "Singh, A. et al. (2020). PlantDoc: A Dataset for Visual Plant Disease Detection in Natural Field Conditions. In Proceedings of the 7th ACM IKDD CoDS and 25th COMAD (CoDS-COMAD 2020), pp. 249-253. DOI: 10.1145/3371158.3371196"
    crops:
      - "Apple"
      - "Bell Pepper"
      - "Blueberry"
      - "Cherry"
      - "Corn (Maize)"
      - "Grape"
      - "Peach"
      - "Potato"
      - "Raspberry"
      - "Soybean"
      - "Strawberry"
      - "Tomato"
    supported_parts:
      - "leaf"
      - "whole_plant"
      - "canopy"
      - "stem"
      - "fruit"
    labels_available:
      - "disease"
      - "healthy"
    size_mb: 1100
    expected_images: 2569
    requires_auth: false
    auth_instructions: ""
    checksum_sha256: ""
    status: "not_downloaded"
    local_dir: "data/raw/datasets/plantdoc"
    known_limitations: "Natural field images with complex background clutter; varying illumination and multi-leaf overlaps require robust object detection/tiling."

  - id: "mendeley_maize_nutrient"
    name: "Maize Nutrient Deficiency Image Dataset (N, P, K, Mg)"
    official_page: "https://data.mendeley.com/datasets/34gb2gr7p2/1"
    download_url: "https://prod-drc-mendeley-cdn.s3.amazonaws.com/34gb2gr7p2/1"
    license: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
    citation: "Bandi, V. et al. (2021). Maize Leaf Nutrient Deficiency Dataset. Mendeley Data, V1, DOI: 10.17632/34gb2gr7p2.1"
    crops:
      - "Corn (Maize)"
    supported_parts:
      - "leaf"
      - "whole_plant"
      - "canopy"
    labels_available:
      - "nutrient_deficiency"
      - "healthy"
    size_mb: 850
    expected_images: 2000
    requires_auth: false
    auth_instructions: ""
    checksum_sha256: ""
    status: "not_downloaded"
    local_dir: "data/raw/datasets/mendeley_maize_nutrient"
    known_limitations: "Visual symptoms of N/P/K/Mg deficiencies on maize can mimic drought or cold stress under field conditions."

